<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Ambient Diffused Light Overlay</title>
  <meta name="description" content="A warm, cozy, diffused ambient lighting background overlay for TikTok LIVE and OBS streaming with instant cloud synchronization.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #0d0a09;
      --vignette-strength: 0.65;
      --blur-strength: 100px;
      --particle-opacity: 0.7;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Main Container */
    #overlay-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
      transition: background-color 2.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Canvas for Light Orbs */
    #light-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(var(--blur-strength)) saturate(135%);
      -webkit-filter: blur(var(--blur-strength)) saturate(135%);
      transform: translate3d(0, 0, 0) scale(1.15);
      mix-blend-mode: screen;
      pointer-events: none;
      will-change: transform;
    }

    /* Secondary Glow Layer for Dreamy Depth */
    #depth-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(calc(var(--blur-strength) * 1.5)) brightness(1.1);
      -webkit-filter: blur(calc(var(--blur-strength) * 1.5)) brightness(1.1);
      mix-blend-mode: lighten;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Particle / Dust Motes Canvas */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: screen;
      opacity: var(--particle-opacity);
      pointer-events: none;
      z-index: 2;
    }

    /* Cinematic Vignette & Fine Grain Texture */
    .cinematic-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 35%,
        rgba(0, 0, 0, calc(var(--vignette-strength) * 0.45)) 75%,
        rgba(0, 0, 0, var(--vignette-strength)) 100%
      );
    }

    /* Subtle Film Grain Noise to prevent banding */
    .grain-overlay {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: 0.038;
      pointer-events: none;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Interactive Floating Gear Icon */
    #settings-toggle-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(22, 24, 34, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.75);
      opacity: 0.22;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    #settings-toggle-btn:hover,
    #settings-toggle-btn:focus-visible {
      opacity: 1;
      transform: scale(1.08) rotate(25deg);
      background: rgba(30, 34, 48, 0.85);
      color: #ffcb2b;
      border-color: rgba(255, 203, 43, 0.45);
    }

    /* Floating Glassmorphism Control Panel */
    #control-panel {
      position: absolute;
      top: 68px;
      right: 18px;
      z-index: 100;
      width: 350px;
      max-width: calc(100vw - 36px);
      max-height: calc(100vh - 86px);
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(16, 18, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      padding: 20px 22px;
      color: #f0f2f8;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px) scale(0.96);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #control-panel::-webkit-scrollbar {
      width: 6px;
    }
    #control-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    #control-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header h2 .sparkle {
      color: #ffcb2b;
      font-size: 18px;
    }

    .panel-header .shortcut-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Live Cloud Sync Bar */
    .sync-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 7px 12px;
      margin-bottom: 16px;
      font-size: 11.5px;
    }

    .sync-status-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-green 2.4s infinite;
    }

    .status-dot.connecting {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulse-yellow 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes pulse-yellow {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .sync-time-badge {
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
      font-size: 10.5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    .form-group label .val-indicator {
      color: #ffcb2b;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Preset Grid */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .theme-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .theme-btn.active {
      background: rgba(255, 203, 43, 0.14);
      border-color: rgba(255, 203, 43, 0.5);
      color: #ffcb2b;
      box-shadow: 0 0 12px rgba(255, 203, 43, 0.18);
    }

    .theme-preview-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    /* Sliders */
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffcb2b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Save & Sync Button */
    .save-sync-section {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn-save-sync {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #ffcb2b 0%, #f59e0b 100%);
      border: none;
      border-radius: 12px;
      color: #1a1500;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-save-sync:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }

    .btn-save-sync:active {
      transform: translateY(1px);
    }

    .btn-save-sync.synced {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    /* Auto Sync Checkbox */
    .auto-sync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.7);
    }

    .auto-sync-row label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .auto-sync-row input[type="checkbox"] {
      accent-color: #ffcb2b;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* Links Cards */
    .source-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .source-box label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 6px;
    }

    .source-box label .pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 5px;
    }

    .pill-tiktok {
      background: rgba(254, 44, 85, 0.15);
      color: #fe2c55;
      border: 1px solid rgba(254, 44, 85, 0.3);
    }

    .pill-local {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .input-with-btn {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-with-btn input {
      flex: 1;
      padding: 7px 9px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #f0f2f8;
      font-family: monospace;
      font-size: 11px;
      outline: none;
    }

    .input-with-btn button {
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .input-with-btn button:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .source-help {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 4px;
      line-height: 1.35;
    }

    /* Actions Footer */
    .panel-footer {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .action-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Toast Notification */
    #toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(20, 24, 34, 0.94);
      border: 1px solid rgba(255, 203, 43, 0.45);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <!-- Diffused Light Orbs Layer -->
    <canvas id="light-canvas"></canvas>
    
    <!-- Deep Ambient Glow Layer -->
    <canvas id="depth-canvas"></canvas>

    <!-- Floating Cozy Dust Motes / Bokeh -->
    <canvas id="particle-canvas"></canvas>

    <!-- Cinematic Vignette & Grain -->
    <div class="cinematic-vignette"></div>
    <div class="grain-overlay"></div>

    <!-- Interactive Settings Toggle Button -->
    <button id="settings-toggle-btn" aria-label="Toggle Overlay Settings" title="Customize Ambient Background (Press 'C')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- Glassmorphism Floating Control Panel -->
    <div id="control-panel">
      <div class="panel-header">
        <h2><span class="sparkle">✨</span> Cozy Lighting</h2>
        <span class="shortcut-badge">Press 'C'</span>
      </div>

      <!-- Live Cloud Sync Status Bar -->
      <div class="sync-status-bar">
        <div class="sync-status-indicator">
          <span class="status-dot connecting" id="sync-dot"></span>
          <span id="sync-status-text" style="font-weight: 500;">Connecting Cloud...</span>
        </div>
        <span class="sync-time-badge" id="sync-time-text">Checking</span>
      </div>

      <!-- Color Theme Presets -->
      <div class="form-group">
        <label>Cozy Palette Preset</label>
        <div class="theme-grid" id="theme-buttons">
          <button class="theme-btn active" data-theme="hearth">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #ff9d3b, #d94625);"></span>
            Warm Hearth
          </button>
          <button class="theme-btn" data-theme="sunset">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #ff7e67, #7c3aed);"></span>
            Lofi Sunset
          </button>
          <button class="theme-btn" data-theme="twilight">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #a78bfa, #3b82f6);"></span>
            Twilight Dream
          </button>
          <button class="theme-btn" data-theme="sakura">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #f472b6, #fb7185);"></span>
            Sakura Dusk
          </button>
          <button class="theme-btn" data-theme="forest">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #34d399, #f59e0b);"></span>
            Matcha Grove
          </button>
          <button class="theme-btn" data-theme="aurora">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #2dd4bf, #6366f1);"></span>
            Ocean Aurora
          </button>
        </div>
      </div>

      <!-- Drift Speed Slider -->
      <div class="form-group">
        <label>
          <span>Movement Speed</span>
          <span class="val-indicator" id="speed-val">0.7x</span>
        </label>
        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.05" value="0.7">
      </div>

      <!-- Glow Diffusion Slider -->
      <div class="form-group">
        <label>
          <span>Glow Diffusion</span>
          <span class="val-indicator" id="blur-val">100px</span>
        </label>
        <input type="range" id="blur-slider" min="50" max="180" step="5" value="100">
      </div>

      <!-- Dust Motes / Particles -->
      <div class="form-group">
        <label>
          <span>Cozy Dust Motes</span>
          <span class="val-indicator" id="particle-val">70%</span>
        </label>
        <input type="range" id="particle-slider" min="0" max="100" step="5" value="70">
      </div>

      <!-- Real-Time Save & Sync Section -->
      <div class="save-sync-section">
        <button class="btn-save-sync" id="save-sync-btn" title="Broadcast settings to TikTok LIVE overlay and all connected instances">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save & Sync to TikTok Live
        </button>

        <div class="auto-sync-row">
          <label for="auto-sync-check">
            <input type="checkbox" id="auto-sync-check" checked>
            <span>Live Sync on Slider Change</span>
          </label>
          <span style="font-size: 10px; color: #ffcb2b;">Auto-Broadcast</span>
        </div>
      </div>

      <!-- TikTok LIVE Studio Hosted URL -->
      <div class="source-box">
        <label>
          <span>TikTok LIVE Studio URL</span>
          <span class="pill pill-tiktok">Public HTTPS</span>
        </label>
        <div class="input-with-btn">
          <input type="text" id="tiktok-route-input" readonly value="https://genreshinobi.github.io/stream-overlays/">
          <button id="copy-tiktok-btn">Copy</button>
        </div>
        <p class="source-help">
          Paste in TikTok Studio Browser Source. Settings saved here update live on stream!
        </p>
      </div>

      <!-- Local Server Route Display -->
      <div class="source-box" style="border-top: none; padding-top: 8px;">
        <label>
          <span>OBS / Local Server Route</span>
          <span class="pill pill-local">Port 8091</span>
        </label>
        <div class="input-with-btn">
          <input type="text" id="server-route-input" readonly value="http://localhost:8091/overlay/cozy_bg">
          <button id="copy-route-btn">Copy</button>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="panel-footer">

    // --- State & URL Parameter Configuration ---
    const urlParams = new URLSearchParams(window.location.search);

    const initialTheme = urlParams.get('theme') || localStorage.getItem('cozy_theme') || 'hearth';
    const initialSpeed = parseFloat(urlParams.get('speed')) || parseFloat(localStorage.getItem('cozy_speed')) || 0.7;

      ? parseFloat(urlParams.get('particles')) 
      : (localStorage.getItem('cozy_particles') !== null ? parseFloat(localStorage.getItem('cozy_particles')) : 70);

    const config = {
      theme: PALETTES[initialTheme] ? initialTheme : 'hearth',
      speed: initialSpeed,
      blur: initialBlur,
      particleIntensity: initialParticles,
      orbCount: 5,
      hueCycleRate: 0.012
    };

    let autoSyncEnabled = localStorage.getItem('cozy_autosync') !== 'false';
    let ws = null;
    let reconnectTimer = null;
    let debounceTimer = null;

    // --- Canvas Setup ---
    const lightCanvas = document.getElementById('light-canvas');
    const lightCtx = lightCanvas.getContext('2d');

    const depthCanvas = document.getElementById('depth-canvas');
    const depthCtx = depthCanvas.getContext('2d');

    const particleCanvas = document.getElementById('particle-canvas');
    const particleCtx = particleCanvas.getContext('2d');

    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      const dpr = 0.5; 
      lightCanvas.width = Math.round(width * dpr);
      lightCanvas.height = Math.round(height * dpr);
      depthCanvas.width = Math.round(width * dpr);
      depthCanvas.height = Math.round(height * dpr);

      particleCanvas.width = width;
      particleCanvas.height = height;

      initOrbs();
      initParticles();
    }

    // --- Light Orbs System with Smooth Morphing ---
    let orbs = [];

    class LightOrb {
      constructor(index, template) {
        this.index = index;
        this.baseHue = template.h;
        this.currentHue = template.h;
        this.sat = template.s;
        this.light = template.l;
        this.radiusFactor = template.r;
        this.speedMult = template.speed;

        this.targetHue = template.h;
        this.targetSat = template.s;
        this.targetLight = template.l;
        this.targetRadiusFactor = template.r;
        this.targetSpeedMult = template.speed;

        this.phaseX = (index * 1.37) + Math.random() * Math.PI;
        this.phaseY = (index * 2.11) + Math.random() * Math.PI;
        this.freqX = 0.28 + (index * 0.08);
        this.freqY = 0.34 + (index * 0.06);

        this.pulsePhase = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.4 + (index * 0.12);

        this.x = width * 0.5;
        this.y = height * 0.5;
        this.radius = 200;
      }

      applyTemplate(template) {
        this.targetHue = template.h;
        this.targetSat = template.s;
        this.targetLight = template.l;
        this.targetRadiusFactor = template.r;
        this.targetSpeedMult = template.speed;
      }

      update(time, delta) {
        // Smoothly interpolate towards target values for seamless color morphs
        const lerpRate = 0.045;
        let dHue = (this.targetHue - this.baseHue) % 360;
        if (dHue > 180) dHue -= 360;
        if (dHue < -180) dHue += 360;
        this.baseHue = (this.baseHue + dHue * lerpRate + 360) % 360;

        this.sat += (this.targetSat - this.sat) * lerpRate;
        this.light += (this.targetLight - this.light) * lerpRate;
        this.radiusFactor += (this.targetRadiusFactor - this.radiusFactor) * lerpRate;
        this.speedMult += (this.targetSpeedMult - this.speedMult) * lerpRate;

        // Organic motion using Lissajous trigonometric paths
        const t = time * 0.00035 * config.speed * this.speedMult;
        const marginX = width * 0.38;
        const marginY = height * 0.42;

        this.x = (width * 0.5) + Math.sin(t * this.freqX + this.phaseX) * marginX;
        this.y = (height * 0.5) + Math.cos(t * this.freqY + this.phaseY) * marginY;

        // Subtle gentle breathing pulse in radius
        const pulse = Math.sin(time * 0.0008 * this.pulseSpeed + this.pulsePhase);
        const baseR = Math.max(width, height) * this.radiusFactor;
        this.radius = baseR * (1 + pulse * 0.15);

        // Slow hue evolution
        this.currentHue = (this.baseHue + Math.sin(time * 0.0001 * config.hueCycleRate + this.index) * 16 + 360) % 360;
      }

      render(ctx, scaleDpr) {
        const drawX = this.x * scaleDpr;
        const drawY = this.y * scaleDpr;
        const drawRadius = this.radius * scaleDpr;

        const grad = ctx.createRadialGradient(
          drawX, drawY, 0,
          drawX, drawY, drawRadius
        );

        const colorCore = `hsla(${this.currentHue}, ${Math.max(0, this.sat)}%, ${Math.min(100, this.light + 6)}%, 0.95)`;
        const colorMid  = `hsla(${this.currentHue}, ${Math.max(0, this.sat - 6)}%, ${this.light}%, 0.55)`;
        const colorEdge = `hsla(${this.currentHue}, ${Math.max(0, this.sat - 12)}%, ${Math.max(0, this.light - 10)}%, 0)`;

        grad.addColorStop(0, colorCore);
        grad.addColorStop(0.35, colorMid);
        grad.addColorStop(1, colorEdge);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(drawX, drawY, drawRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initOrbs() {
      const palette = PALETTES[config.theme] || PALETTES.hearth;
      orbs = palette.orbs.map((template, i) => new LightOrb(i, template));
      document.getElementById('overlay-container').style.backgroundColor = palette.bg;
    }

    function morphPalette(themeId) {
      const palette = PALETTES[themeId] || PALETTES.hearth;
      config.theme = themeId;
      document.getElementById('overlay-container').style.backgroundColor = palette.bg;
      
      if (orbs.length === palette.orbs.length) {
        palette.orbs.forEach((template, i) => {
          orbs[i].applyTemplate(template);
        });
      } else {
        initOrbs();
      }
    }

    // --- Cozy Dust Motes / Bokeh Particle System ---
    let particles = [];
    const MAX_PARTICLES = 65;

    class DustMote {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        // Spawn anywhere throughout the entire space (full width and height)
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 1.2 + Math.random() * 3.4;
        
        // Gentle organic drift with subtle upward thermal float
        this.speedY = 0.08 + Math.random() * 0.32;
        this.driftX = (Math.random() - 0.5) * 0.35;
        
        this.maxAlpha = 0.22 + Math.random() * 0.65;
        // On startup randomize alpha so particles are immediately spread; on respawn fade in organically
        this.alpha = initial ? (Math.random() * this.maxAlpha) : 0;
        this.fadeSpeed = 0.003 + Math.random() * 0.007;
        this.fadingIn = true;
        this.oscOffsetX = Math.random() * Math.PI * 2;
        this.oscOffsetY = Math.random() * Math.PI * 2;
      }

      update(time) {
        const spd = (config.speed * 0.7 + 0.3);
        this.y -= this.speedY * spd;
        this.x += (this.driftX + Math.sin(time * 0.0011 + this.oscOffsetX) * 0.32) * spd;
        this.y += Math.cos(time * 0.0009 + this.oscOffsetY) * 0.22 * spd;

        // Gentle breathing fade in / fade out cycle
        if (this.fadingIn) {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= this.maxAlpha) {
            this.alpha = this.maxAlpha;
            this.fadingIn = false;
          }
        } else {
          this.alpha -= this.fadeSpeed * 0.75;
          if (this.alpha <= 0) {
            this.reset(false);
          }
        }

        // If particle drifts out of viewport bounds, respawn anywhere in the space
        if (this.y < -30 || this.y > height + 30 || this.x < -30 || this.x > width + 30) {
          this.reset(false);
        }
      }

      render(ctx, baseHue) {
        if (this.alpha <= 0.005) return;
        ctx.save();
        ctx.fillStyle = `hsla(${baseHue + 15}, 85%, 75%, ${this.alpha})`;
        ctx.shadowColor = `hsla(${baseHue}, 90%, 65%, ${this.alpha * 0.85})`;
        ctx.shadowBlur = this.size * 3.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      const count = Math.round(MAX_PARTICLES * (config.particleIntensity / 100));
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push(new DustMote());
      }
    }

    // --- Main Animation Loop ---
    let lastTime = 0;

    function renderLoop(time) {
      const delta = Math.min(time - lastTime, 64);
      lastTime = time;

      const dpr = 0.5;
      const lw = lightCanvas.width;
      const lh = lightCanvas.height;

      lightCtx.clearRect(0, 0, lw, lh);
      depthCtx.clearRect(0, 0, lw, lh);
      particleCtx.clearRect(0, 0, width, height);

      // Render Light Orbs
      for (let i = 0; i < orbs.length; i++) {
        const orb = orbs[i];
        orb.update(time, delta);
        orb.render(lightCtx, dpr);
        
        if (i === 0 || i === 2) {
          orb.render(depthCtx, dpr);
        }
      }

      // Render Floating Dust Motes
      if (config.particleIntensity > 0) {
        const palette = PALETTES[config.theme] || PALETTES.hearth;
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(time);
          particles[i].render(particleCtx, palette.particleHue);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // --- Cloud Synchronization System ---
    function updateSyncStatus(connected, message) {
      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-status-text');
      if (dot) {
        dot.className = 'status-dot ' + (connected ? 'connected' : 'connecting');
      }
      if (txt) {
        txt.textContent = message || (connected ? 'Live Sync Active' : 'Connecting Cloud...');
      }
    }

    function updateLastSyncTime() {
      const timeEl = document.getElementById('sync-time-text');
      if (timeEl) {
        const now = new Date();
        timeEl.textContent = 'Synced ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
    }

    function applyRemoteConfig(remote) {
      if (!remote) return;
      
      if (remote.theme && PALETTES[remote.theme] && remote.theme !== config.theme) {
        morphPalette(remote.theme);
      }
      
      if (typeof remote.speed === 'number' && !isNaN(remote.speed)) {
        config.speed = remote.speed;
      }
      
      if (typeof remote.blur === 'number' && !isNaN(remote.blur)) {
        config.blur = remote.blur;
        document.documentElement.style.setProperty('--blur-strength', config.blur + 'px');
      }
      
      if (typeof remote.particleIntensity === 'number' && !isNaN(remote.particleIntensity)) {
        config.particleIntensity = remote.particleIntensity;
        document.documentElement.style.setProperty('--particle-opacity', (config.particleIntensity / 100) * 0.75);
        initParticles();
      }
      
      // Cache locally
      localStorage.setItem('cozy_theme', config.theme);
      localStorage.setItem('cozy_speed', config.speed);
      localStorage.setItem('cozy_blur', config.blur);
      localStorage.setItem('cozy_particles', config.particleIntensity);
      
      syncUI();
      updateLastSyncTime();
    }

    async function loadLatestSavedConfig() {
      try {
        const res = await fetch(`https://ntfy.sh/${SYNC_TOPIC}/json?poll=1`, { cache: 'no-store' });
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const item = JSON.parse(lines[i]);
            if (item.event === 'message' && item.message) {
              const cfg = JSON.parse(item.message);
              if (cfg && cfg.action === 'sync_config') {
                applyRemoteConfig(cfg);
                break;
              }
            }
          } catch (e) {}
        }
      } catch (err) {
        console.warn("Cloud config poll:", err);
      }
    }

    function connectWebSocket() {
      if (ws) {
        try { ws.close(); } catch (e) {}
      }
      
      updateSyncStatus(false, "Connecting to Cloud...");
      
      try {
        ws = new WebSocket(`wss://ntfy.sh/${SYNC_TOPIC}/ws`);
        
        ws.onopen = () => {
          updateSyncStatus(true, "Live Sync Active");
        };
        
        ws.onmessage = (event) => {
          try {
            const item = JSON.parse(event.data);
            if (item.event === 'message' && item.message) {
              const data = JSON.parse(item.message);
              if (data && data.action === 'sync_config' && data.clientId !== CLIENT_ID) {
                applyRemoteConfig(data);
                showToast(`✨ Synced live: ${PALETTES[data.theme]?.name || data.theme}`);
              }
            }
          } catch (e) {}
        };
        
        ws.onclose = () => {
          updateSyncStatus(false, "Reconnecting...");
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connectWebSocket, 3500);
        };
        
        ws.onerror = () => {
          try { ws.close(); } catch (e) {}
        };
      } catch (err) {
        updateSyncStatus(false, "Offline / Reconnecting");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWebSocket, 5000);
      }
    }

    async function broadcastConfig(isManualSave = false) {
      const saveBtn = document.getElementById('save-sync-btn');
      if (isManualSave && saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>⏳</span> Syncing to TikTok Live...`;
      }

      const payload = {
        action: 'sync_config',
        clientId: CLIENT_ID,
        theme: config.theme,
        speed: config.speed,
        blur: config.blur,
        particleIntensity: config.particleIntensity,
        timestamp: Date.now()
      };

      localStorage.setItem('cozy_theme', config.theme);
      localStorage.setItem('cozy_speed', config.speed);
      localStorage.setItem('cozy_blur', config.blur);
      localStorage.setItem('cozy_particles', config.particleIntensity);

      try {
        const res = await fetch(`https://ntfy.sh/${SYNC_TOPIC}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          updateLastSyncTime();
          if (isManualSave) {
            if (saveBtn) {
              saveBtn.innerHTML = `<span>✅</span> Synced to TikTok Live!`;
              saveBtn.classList.add('synced');
              setTimeout(() => {
                saveBtn.disabled = false;
                saveBtn.classList.remove('synced');
                saveBtn.innerHTML = `
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                  </svg>
                  Save & Sync to TikTok Live
                `;
              }, 2000);
            }
            showToast("✨ Settings saved & synced to TikTok Live!");
          }
        } else {
          throw new Error(`HTTP ${res.status}`);
        }
      } catch (err) {
        console.warn("Sync publish error:", err);
        if (isManualSave) {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<span>⚠️</span> Retry Sync`;
          }
          showToast("⚠️ Could not broadcast. Retrying in background.");
        }
      }
    }

    function queueAutoSync() {
      if (!autoSyncEnabled) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        broadcastConfig(false);
      }, 250);
    }

    // --- Control Panel & UI Logic ---
    const panel = document.getElementById('control-panel');
    const toggleBtn = document.getElementById('settings-toggle-btn');
    const hideBtn = document.getElementById('hide-btn');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const blurSlider = document.getElementById('blur-slider');
    const blurVal = document.getElementById('blur-val');
    const particleSlider = document.getElementById('particle-slider');
    const particleVal = document.getElementById('particle-val');
    const themeButtonsContainer = document.getElementById('theme-buttons');
    const saveSyncBtn = document.getElementById('save-sync-btn');
    const autoSyncCheck = document.getElementById('auto-sync-check');
    const copyUrlBtn = document.getElementById('copy-url-btn');
    const copyTiktokBtn = document.getElementById('copy-tiktok-btn');
    const copyRouteBtn = document.getElementById('copy-route-btn');
    const tiktokRouteInput = document.getElementById('tiktok-route-input');
    const serverRouteInput = document.getElementById('server-route-input');
    const toast = document.getElementById('toast');

    function togglePanel() {
      panel.classList.toggle('open');
    }

    toggleBtn.addEventListener('click', togglePanel);
    hideBtn.addEventListener('click', () => panel.classList.remove('open'));

    // Keyboard shortcut 'C' or 'Escape'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') {
        togglePanel();
      } else if (e.key === 'Escape' && panel.classList.contains('open')) {
        panel.classList.remove('open');
      }
    });

    // Theme preset switcher
    themeButtonsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;

      const themeId = btn.getAttribute('data-theme');
      if (!PALETTES[themeId]) return;

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      morphPalette(themeId);
      localStorage.setItem('cozy_theme', themeId);
      queueAutoSync();
    });

    // Speed Slider
    speedSlider.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      speedVal.textContent = config.speed.toFixed(2) + 'x';
      localStorage.setItem('cozy_speed', config.speed);
      queueAutoSync();
    });

    // Blur Slider
    blurSlider.addEventListener('input', (e) => {
      config.blur = parseInt(e.target.value);
      blurVal.textContent = config.blur + 'px';
      document.documentElement.style.setProperty('--blur-strength', config.blur + 'px');
      localStorage.setItem('cozy_blur', config.blur);
      queueAutoSync();
    });

    // Particles Slider
    particleSlider.addEventListener('input', (e) => {
      config.particleIntensity = parseInt(e.target.value);
      particleVal.textContent = config.particleIntensity + '%';
      document.documentElement.style.setProperty('--particle-opacity', (config.particleIntensity / 100) * 0.75);
      localStorage.setItem('cozy_particles', config.particleIntensity);
      initParticles();
      queueAutoSync();
    });

    // Save & Sync button
    saveSyncBtn.addEventListener('click', () => {
      broadcastConfig(true);
    });

    // Auto-sync toggle
    autoSyncCheck.checked = autoSyncEnabled;
    autoSyncCheck.addEventListener('change', (e) => {
      autoSyncEnabled = e.target.checked;
      localStorage.setItem('cozy_autosync', autoSyncEnabled);
      if (autoSyncEnabled) {
        broadcastConfig(false);
      }
    });

    // Sync UI with current config
    function syncUI() {
      document.querySelectorAll('.theme-btn').forEach(b => {
        if (b.getAttribute('data-theme') === config.theme) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });

      speedSlider.value = config.speed;
      speedVal.textContent = config.speed.toFixed(2) + 'x';

      blurSlider.value = config.blur;
      blurVal.textContent = config.blur + 'px';
      document.documentElement.style.setProperty('--blur-strength', config.blur + 'px');

      particleSlider.value = config.particleIntensity;
      particleVal.textContent = config.particleIntensity + '%';
      document.documentElement.style.setProperty('--particle-opacity', (config.particleIntensity / 100) * 0.75);
    }

    // Route updates
    function updateRoutes() {
      if (window.location.protocol.startsWith('http')) {
        serverRouteInput.value = `${window.location.origin}/overlay/cozy_bg`;
      } else {
        serverRouteInput.value = 'http://localhost:8091/overlay/cozy_bg';
      }
    }
    updateRoutes();

    // Copy TikTok URL
    copyTiktokBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(tiktokRouteInput.value).then(() => {
        showToast("✨ TikTok LIVE Studio URL copied!");
      }).catch(() => {
        prompt("Copy TikTok LIVE Studio URL:", tiktokRouteInput.value);
      });
    });

    // Copy Local Route
    copyRouteBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(serverRouteInput.value).then(() => {
        showToast("✨ Local Server Route copied!");
      }).catch(() => {
        prompt("Copy Local Server Route:", serverRouteInput.value);
      });
    });

    // Copy direct URL with parameters
    copyUrlBtn.addEventListener('click', () => {
      const base = window.location.protocol === 'file:' ? 'https://genreshinobi.github.io/stream-overlays/' : `${window.location.origin}${window.location.pathname}`;
      const fullUrl = `${base}?theme=${config.theme}&speed=${config.speed}&blur=${config.blur}&particles=${config.particleIntensity}`;

      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast("✨ Direct Browser Source link copied!");
      }).catch(() => {
        prompt("Copy direct URL:", fullUrl);
      });
    });

    function showToast(msg) {
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // Auto-open panel if requested via query param (e.g. controller view)
    if (urlParams.get('controls') === '1' || urlParams.get('panel') === '1') {
      panel.classList.add('open');
    }
    if (urlParams.get('hidebtn') === '1') {
      toggleBtn.style.display = 'none';
    }

    // --- Init ---
    window.addEventListener('resize', resize);
    window.addEventListener('DOMContentLoaded', async () => {
      syncUI();
      resize();
      requestAnimationFrame(renderLoop);

      // Start cloud synchronization
      await loadLatestSavedConfig();
      connectWebSocket();
    });
  </script>
</body>
</html>
