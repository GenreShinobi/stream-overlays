<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Ambient Diffused Light Overlay</title>
  <meta name="description" content="A warm, cozy, diffused ambient lighting background overlay for TikTok LIVE and OBS streaming.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #0a0b10;
      --vignette-strength: 0.65;
      --blur-strength: 100px;
      --particle-opacity: 0.7;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Main Container */
    #overlay-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
      transition: background-color 2.5s ease;
    }

    /* Canvas for Light Orbs */
    #light-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(var(--blur-strength)) saturate(135%);
      -webkit-filter: blur(var(--blur-strength)) saturate(135%);
      transform: translate3d(0, 0, 0) scale(1.15); /* Scale slightly so blurred edges cover screen fully */
      mix-blend-mode: screen;
      pointer-events: none;
      will-change: transform;
    }

    /* Secondary Glow Layer for Dreamy Depth */
    #depth-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(calc(var(--blur-strength) * 1.5)) brightness(1.1);
      -webkit-filter: blur(calc(var(--blur-strength) * 1.5)) brightness(1.1);
      mix-blend-mode: lighten;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Particle / Dust Motes Canvas */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: screen;
      opacity: var(--particle-opacity);
      pointer-events: none;
      z-index: 2;
    }

    /* Cinematic Vignette & Fine Grain Texture */
    .cinematic-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 35%,
        rgba(0, 0, 0, calc(var(--vignette-strength) * 0.45)) 75%,
        rgba(0, 0, 0, var(--vignette-strength)) 100%
      );
    }

    /* Subtle Film Grain Noise to prevent banding */
    .grain-overlay {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: 0.038;
      pointer-events: none;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Interactive Floating Gear Icon (Hidden by default, shows on hover or click) */
    #settings-toggle-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(22, 24, 34, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0.18;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    #settings-toggle-btn:hover,
    #settings-toggle-btn:focus-visible {
      opacity: 1;
      transform: scale(1.08) rotate(25deg);
      background: rgba(30, 34, 48, 0.85);
      color: #ffcb2b;
      border-color: rgba(255, 203, 43, 0.4);
    }

    /* Floating Glassmorphism Control Panel */
    #control-panel {
      position: absolute;
      top: 68px;
      right: 18px;
      z-index: 100;
      width: 320px;
      max-width: calc(100vw - 36px);
      background: rgba(16, 18, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      padding: 20px 22px;
      color: #f0f2f8;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px) scale(0.96);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #control-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header h2 .sparkle {
      color: #ffcb2b;
      font-size: 18px;
    }

    .panel-header .shortcut-badge {
      font-size: 11px;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.55);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }

    .form-group label .val-indicator {
      color: #ffcb2b;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Preset Grid */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .theme-btn.active {
      background: rgba(255, 203, 43, 0.14);
      border-color: rgba(255, 203, 43, 0.45);
      color: #ffcb2b;
      box-shadow: 0 0 12px rgba(255, 203, 43, 0.15);
    }

    .theme-preview-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    /* Sliders */
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffcb2b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Actions Footer */
    .panel-footer {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .action-btn {
      flex: 1;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffcb2b 0%, #e6a817 100%);
      border: none;
      color: #1a1500;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 14px rgba(255, 203, 43, 0.35);
    }

    /* Toast Notification for Copying URL */
    #toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(20, 24, 34, 0.92);
      border: 1px solid rgba(255, 203, 43, 0.4);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <!-- Diffused Light Orbs Layer -->
    <canvas id="light-canvas"></canvas>
    
    <!-- Deep Ambient Glow Layer -->
    <canvas id="depth-canvas"></canvas>

    <!-- Floating Cozy Dust Motes / Bokeh -->
    <canvas id="particle-canvas"></canvas>

    <!-- Cinematic Vignette & Grain -->
    <div class="cinematic-vignette"></div>
    <div class="grain-overlay"></div>

    <!-- Interactive Settings Toggle Button -->
    <button id="settings-toggle-btn" aria-label="Toggle Overlay Settings" title="Customize Ambient Background (Press 'C')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- Glassmorphism Floating Control Panel -->
    <div id="control-panel">
      <div class="panel-header">
        <h2><span class="sparkle">✨</span> Cozy Lighting</h2>
        <span class="shortcut-badge">Press 'C'</span>
      </div>

      <!-- Color Theme Presets -->
      <div class="form-group">
        <label>Cozy Palette Preset</label>
        <div class="theme-grid" id="theme-buttons">
          <button class="theme-btn active" data-theme="hearth">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #ff9d3b, #d94625);"></span>
            Warm Hearth
          </button>
          <button class="theme-btn" data-theme="sunset">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #ff7e67, #7c3aed);"></span>
            Lofi Sunset
          </button>
          <button class="theme-btn" data-theme="twilight">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #a78bfa, #3b82f6);"></span>
            Twilight Dream
          </button>
          <button class="theme-btn" data-theme="sakura">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #f472b6, #fb7185);"></span>
            Sakura Dusk
          </button>
          <button class="theme-btn" data-theme="forest">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #34d399, #f59e0b);"></span>
            Matcha Grove
          </button>
          <button class="theme-btn" data-theme="aurora">
            <span class="theme-preview-dot" style="background: linear-gradient(135deg, #2dd4bf, #6366f1);"></span>
            Ocean Aurora
          </button>
        </div>
      </div>

      <!-- Drift Speed Slider -->
      <div class="form-group">
        <label>
          <span>Movement Speed</span>
          <span class="val-indicator" id="speed-val">0.7x</span>
        </label>
        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.05" value="0.7">
      </div>

      <!-- Glow Diffusion Slider -->
      <div class="form-group">
        <label>
          <span>Glow Diffusion</span>
          <span class="val-indicator" id="blur-val">100px</span>
        </label>
        <input type="range" id="blur-slider" min="50" max="180" step="5" value="100">
      </div>

      <!-- Dust Motes / Particles -->
      <div class="form-group">
        <label>
          <span>Cozy Dust Motes</span>
          <span class="val-indicator" id="particle-val">70%</span>
        </label>
        <input type="range" id="particle-slider" min="0" max="100" step="5" value="70">
      </div>

      <!-- Local Server Route Display -->
      <div class="form-group" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08);">
        <label>
          <span>Local Server Route</span>
          <span class="val-indicator" style="font-size: 11px; color: #34d399;" id="server-status-pill">● Port 8091</span>
        </label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="text" id="server-route-input" readonly value="http://localhost:8091/overlay/cozy_bg"
            style="flex: 1; padding: 7px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #f0f2f8; font-family: monospace; font-size: 11.5px; outline: none;">
          <button id="copy-route-btn" style="padding: 7px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #ffffff; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease;">
            Copy
          </button>
        </div>
        <p style="font-size: 10.5px; color: rgba(255,255,255,0.45); margin-top: 5px; line-height: 1.3;">
          Add as OBS Browser Source when Origins Dex is running.
        </p>
      </div>

      <!-- Footer Buttons -->
      <div class="panel-footer">
        <button class="action-btn btn-secondary" id="hide-btn" title="Hide Settings Panel">
          Close
        </button>
        <button class="action-btn btn-primary" id="copy-url-btn" title="Copy Current URL with Settings">
          Copy OBS Link
        </button>
      </div>
    </div>

    <!-- Copied Toast Notification -->
    <div id="toast">
      <span>✨</span>
      <span id="toast-text">OBS Browser Source URL copied!</span>
    </div>
  </div>

  <script>
    // --- Preset Color Palettes ---
    // Each theme defines:
    //   bg: Background base hex
    //   orbs: Array of light orb objects { h, s, l, radiusMin, radiusMax, speedMult }
    //   particleHue: base hue for floating motes
    const PALETTES = {
      hearth: {
        name: "Warm Hearth",
        bg: "#0d0a09",
        particleHue: 36,
        orbs: [
          { h: 32, s: 95, l: 56, r: 0.42, speed: 0.9 },  // Warm Amber Glow
          { h: 14, s: 90, l: 50, r: 0.38, speed: 0.75 }, // Cozy Hearth Flame
          { h: 42, s: 92, l: 62, r: 0.35, speed: 1.1 },  // Golden Honey
          { h: 4, s: 82, l: 45, r: 0.45, speed: 0.65 },  // Deep Mahogany Ember
          { h: 26, s: 94, l: 54, r: 0.32, speed: 0.85 }  // Apricot Nectar
        ]
      },
      sunset: {
        name: "Lofi Sunset",
        bg: "#0f0c18",
        particleHue: 350,
        orbs: [
          { h: 18, s: 92, l: 58, r: 0.44, speed: 0.8 },  // Warm Tangerine
          { h: 342, s: 86, l: 60, r: 0.38, speed: 0.95 },// Pastel Sunset Rose
          { h: 265, s: 84, l: 56, r: 0.42, speed: 0.7 },  // Twilight Dusk Purple
          { h: 45, s: 95, l: 62, r: 0.32, speed: 1.05 }, // Golden Sun Horizon
          { h: 320, s: 78, l: 52, r: 0.36, speed: 0.85 } // Magenta Glow
        ]
      },
      twilight: {
        name: "Twilight Dream",
        bg: "#0a0a16",
        particleHue: 250,
        orbs: [
          { h: 258, s: 88, l: 64, r: 0.45, speed: 0.85 }, // Soft Lavender
          { h: 220, s: 90, l: 58, r: 0.40, speed: 0.7 },  // Periwinkle Sky
          { h: 285, s: 78, l: 52, r: 0.36, speed: 1.0 },  // Midnight Violet
          { h: 195, s: 86, l: 62, r: 0.34, speed: 0.8 },  // Starlight Cyan
          { h: 240, s: 75, l: 55, r: 0.42, speed: 0.65 }  // Deep Indigo
        ]
      },
      sakura: {
        name: "Sakura Dusk",
        bg: "#120a10",
        particleHue: 330,
        orbs: [
          { h: 335, s: 88, l: 65, r: 0.42, speed: 0.9 },  // Cherry Blossom Pink
          { h: 352, s: 82, l: 60, r: 0.38, speed: 0.75 }, // Soft Rose Petal
          { h: 280, s: 70, l: 58, r: 0.40, speed: 0.85 }, // Lilac Mist
          { h: 15, s: 92, l: 66, r: 0.35, speed: 1.05 },  // Warm Cream Blossom
          { h: 310, s: 75, l: 52, r: 0.36, speed: 0.7 }   // Orchid Dusk
        ]
      },
      forest: {
        name: "Matcha Grove",
        bg: "#070f0c",
        particleHue: 50,
        orbs: [
          { h: 152, s: 76, l: 50, r: 0.44, speed: 0.8 },  // Soft Sage Green
          { h: 42, s: 94, l: 58, r: 0.36, speed: 0.95 }, // Firefly Amber
          { h: 168, s: 82, l: 46, r: 0.40, speed: 0.7 },  // Deep Matcha Tea
          { h: 72, s: 80, l: 54, r: 0.32, speed: 1.1 },  // Spring Olive
          { h: 135, s: 68, l: 45, r: 0.42, speed: 0.85 }  // Forest Canopy
        ]
      },
      aurora: {
        name: "Ocean Aurora",
        bg: "#060e18",
        particleHue: 175,
        orbs: [
          { h: 175, s: 88, l: 52, r: 0.46, speed: 0.85 }, // Diffused Seafoam
          { h: 212, s: 92, l: 56, r: 0.40, speed: 0.75 }, // Sapphire Ripple
          { h: 155, s: 78, l: 56, r: 0.35, speed: 1.0 },  // Northern Lights Mint
          { h: 245, s: 80, l: 58, r: 0.42, speed: 0.65 }, // Abyssal Indigo
          { h: 190, s: 95, l: 60, r: 0.34, speed: 0.9 }   // Arctic Cyan
        ]
      }
    };

    // --- State & URL Parameter Configuration ---
    const urlParams = new URLSearchParams(window.location.search);
    const initialTheme = urlParams.get('theme') || localStorage.getItem('cozy_theme') || 'hearth';
    const initialSpeed = parseFloat(urlParams.get('speed')) || parseFloat(localStorage.getItem('cozy_speed')) || 0.7;
    const initialBlur = parseInt(urlParams.get('blur')) || parseInt(localStorage.getItem('cozy_blur')) || 100;
    const initialParticles = parseFloat(urlParams.get('particles')) !== null && !isNaN(parseFloat(urlParams.get('particles'))) 
      ? parseFloat(urlParams.get('particles')) 
      : (localStorage.getItem('cozy_particles') !== null ? parseFloat(localStorage.getItem('cozy_particles')) : 70);

    const config = {
      theme: PALETTES[initialTheme] ? initialTheme : 'hearth',
      speed: initialSpeed,
      blur: initialBlur,
      particleIntensity: initialParticles,
      orbCount: 5,
      hueCycleRate: 0.012 // Very slow, graceful color evolution
    };

    // --- Canvas Setup ---
    const lightCanvas = document.getElementById('light-canvas');
    const lightCtx = lightCanvas.getContext('2d');

    const depthCanvas = document.getElementById('depth-canvas');
    const depthCtx = depthCanvas.getContext('2d');

    const particleCanvas = document.getElementById('particle-canvas');
    const particleCtx = particleCanvas.getContext('2d');

    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      // Downscaled rendering resolution for incredible 60fps performance and built-in smooth diffusion
      const dpr = 0.5; 
      lightCanvas.width = Math.round(width * dpr);
      lightCanvas.height = Math.round(height * dpr);
      depthCanvas.width = Math.round(width * dpr);
      depthCanvas.height = Math.round(height * dpr);

      // Particle canvas at 1.0 DPR for crisp floating motes
      particleCanvas.width = width;
      particleCanvas.height = height;

      initOrbs();
      initParticles();
    }

    // --- Light Orbs System ---
    let orbs = [];

    class LightOrb {
      constructor(index, template) {
        this.index = index;
        this.baseHue = template.h;
        this.currentHue = template.h;
        this.sat = template.s;
        this.light = template.l;
        this.radiusFactor = template.r;
        this.speedMult = template.speed;

        // Lissajous curve parameters for smooth, organic infinite paths
        this.phaseX = (index * 1.37) + Math.random() * Math.PI;
        this.phaseY = (index * 2.11) + Math.random() * Math.PI;
        this.freqX = 0.28 + (index * 0.08);
        this.freqY = 0.34 + (index * 0.06);

        // Breathing pulse phase
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.4 + (index * 0.12);

        this.x = width * 0.5;
        this.y = height * 0.5;
        this.radius = 200;
      }

      update(time, delta) {
        // Organic motion using Lissajous trigonometric paths
        const t = time * 0.00035 * config.speed * this.speedMult;
        
        // Centered drift with 40% margin coverage
        const marginX = width * 0.38;
        const marginY = height * 0.42;

        this.x = (width * 0.5) + Math.sin(t * this.freqX + this.phaseX) * marginX;
        this.y = (height * 0.5) + Math.cos(t * this.freqY + this.phaseY) * marginY;

        // Subtle gentle breathing pulse in radius
        const pulse = Math.sin(time * 0.0008 * this.pulseSpeed + this.pulsePhase);
        const baseR = Math.max(width, height) * this.radiusFactor;
        this.radius = baseR * (1 + pulse * 0.15);

        // Very slow hue shift so colors evolve over time
        this.currentHue = (this.baseHue + Math.sin(time * 0.0001 * config.hueCycleRate + this.index) * 16 + 360) % 360;
      }

      render(ctx, scaleDpr) {
        const drawX = this.x * scaleDpr;
        const drawY = this.y * scaleDpr;
        const drawRadius = this.radius * scaleDpr;

        const grad = ctx.createRadialGradient(
          drawX, drawY, 0,
          drawX, drawY, drawRadius
        );

        const colorCore = `hsla(${this.currentHue}, ${this.sat}%, ${this.light + 6}%, 0.95)`;
        const colorMid  = `hsla(${this.currentHue}, ${this.sat - 6}%, ${this.light}%, 0.55)`;
        const colorEdge = `hsla(${this.currentHue}, ${this.sat - 12}%, ${this.light - 10}%, 0)`;

        grad.addColorStop(0, colorCore);
        grad.addColorStop(0.35, colorMid);
        grad.addColorStop(1, colorEdge);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(drawX, drawY, drawRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initOrbs() {
      const palette = PALETTES[config.theme] || PALETTES.hearth;
      orbs = palette.orbs.map((template, i) => new LightOrb(i, template));
      document.getElementById('overlay-container').style.backgroundColor = palette.bg;
    }

    // --- Cozy Dust Motes / Bokeh Particle System ---
    let particles = [];
    const MAX_PARTICLES = 65;

    class DustMote {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 15;
        this.size = 1.2 + Math.random() * 3.2;
        this.speedY = 0.15 + Math.random() * 0.45;
        this.driftX = (Math.random() - 0.5) * 0.3;
        this.alpha = 0;
        this.maxAlpha = 0.25 + Math.random() * 0.65;
        this.fadeSpeed = 0.004 + Math.random() * 0.008;
        this.fadingIn = true;
        this.oscOffset = Math.random() * Math.PI * 2;
      }

      update(time) {
        this.y -= this.speedY * (config.speed * 0.7 + 0.3);
        this.x += this.driftX + Math.sin(time * 0.0012 + this.oscOffset) * 0.25;

        // Gentle breathing fade in / fade out
        if (this.fadingIn) {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= this.maxAlpha) {
            this.alpha = this.maxAlpha;
            this.fadingIn = false;
          }
        } else {
          this.alpha -= this.fadeSpeed * 0.7;
          if (this.alpha <= 0) {
            this.reset(false);
          }
        }

        if (this.y < -20 || this.x < -20 || this.x > width + 20) {
          this.reset(false);
        }
      }

      render(ctx, baseHue) {
        ctx.save();
        ctx.fillStyle = `hsla(${baseHue + 15}, 85%, 75%, ${this.alpha})`;
        ctx.shadowColor = `hsla(${baseHue}, 90%, 65%, ${this.alpha * 0.8})`;
        ctx.shadowBlur = this.size * 3.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      const count = Math.round(MAX_PARTICLES * (config.particleIntensity / 100));
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push(new DustMote());
      }
    }

    // --- Main Animation Loop ---
    let lastTime = 0;

    function renderLoop(time) {
      const delta = Math.min(time - lastTime, 64);
      lastTime = time;

      const dpr = 0.5;
      const lw = lightCanvas.width;
      const lh = lightCanvas.height;

      // Clear layers
      lightCtx.clearRect(0, 0, lw, lh);
      depthCtx.clearRect(0, 0, lw, lh);
      particleCtx.clearRect(0, 0, width, height);

      // Update & Render Light Orbs
      for (let i = 0; i < orbs.length; i++) {
        const orb = orbs[i];
        orb.update(time, delta);
        orb.render(lightCtx, dpr);
        
        // Render 2 of the prominent orbs to the depth layer for luscious soft falloff
        if (i === 0 || i === 2) {
          orb.render(depthCtx, dpr);
        }
      }

      // Render Floating Dust Motes
      if (config.particleIntensity > 0) {
        const palette = PALETTES[config.theme] || PALETTES.hearth;
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(time);
          particles[i].render(particleCtx, palette.particleHue);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // --- Control Panel & UI Logic ---
    const panel = document.getElementById('control-panel');
    const toggleBtn = document.getElementById('settings-toggle-btn');
    const hideBtn = document.getElementById('hide-btn');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const blurSlider = document.getElementById('blur-slider');
    const blurVal = document.getElementById('blur-val');
    const particleSlider = document.getElementById('particle-slider');
    const particleVal = document.getElementById('particle-val');
    const themeButtonsContainer = document.getElementById('theme-buttons');
    const copyUrlBtn = document.getElementById('copy-url-btn');
    const toast = document.getElementById('toast');

    function togglePanel() {
      panel.classList.toggle('open');
    }

    toggleBtn.addEventListener('click', togglePanel);
    hideBtn.addEventListener('click', () => panel.classList.remove('open'));

    // Keyboard shortcut 'C' or 'Escape'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') {
        togglePanel();
      } else if (e.key === 'Escape' && panel.classList.contains('open')) {
        panel.classList.remove('open');
      }
    });

    // Theme preset switcher
    themeButtonsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;

      const themeId = btn.getAttribute('data-theme');
      if (!PALETTES[themeId]) return;

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      config.theme = themeId;
      localStorage.setItem('cozy_theme', themeId);
      initOrbs();
    });

    // Speed Slider
    speedSlider.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      speedVal.textContent = config.speed.toFixed(2) + 'x';
      localStorage.setItem('cozy_speed', config.speed);
    });

    // Blur Slider
    blurSlider.addEventListener('input', (e) => {
      config.blur = parseInt(e.target.value);
      blurVal.textContent = config.blur + 'px';
      document.documentElement.style.setProperty('--blur-strength', config.blur + 'px');
      localStorage.setItem('cozy_blur', config.blur);
    });

    // Particles Slider
    particleSlider.addEventListener('input', (e) => {
      config.particleIntensity = parseInt(e.target.value);
      particleVal.textContent = config.particleIntensity + '%';
      document.documentElement.style.setProperty('--particle-opacity', (config.particleIntensity / 100) * 0.75);
      localStorage.setItem('cozy_particles', config.particleIntensity);
      initParticles();
    });

    // Initialize UI Elements
    function syncUI() {
      // Set active preset button
      document.querySelectorAll('.theme-btn').forEach(b => {
        if (b.getAttribute('data-theme') === config.theme) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });

      speedSlider.value = config.speed;
      speedVal.textContent = config.speed.toFixed(2) + 'x';

      blurSlider.value = config.blur;
      blurVal.textContent = config.blur + 'px';
      document.documentElement.style.setProperty('--blur-strength', config.blur + 'px');

      particleSlider.value = config.particleIntensity;
      particleVal.textContent = config.particleIntensity + '%';
      document.documentElement.style.setProperty('--particle-opacity', (config.particleIntensity / 100) * 0.75);
    }

    // Local Server Route
    const serverRouteInput = document.getElementById('server-route-input');
    const copyRouteBtn = document.getElementById('copy-route-btn');
    const serverStatusPill = document.getElementById('server-status-pill');

    function updateServerRoute() {
      if (window.location.protocol.startsWith('http')) {
        serverRouteInput.value = `${window.location.origin}/overlay/cozy_bg`;
        if (serverStatusPill) serverStatusPill.textContent = '● Connected';
      } else {
        serverRouteInput.value = 'http://localhost:8091/overlay/cozy_bg';
      }
    }
    updateServerRoute();

    copyRouteBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(serverRouteInput.value).then(() => {
        showToast("✨ Local Server Route copied!");
      }).catch(() => {
        prompt("Copy Local Server Route:", serverRouteInput.value);
      });
    });

    // Copy OBS URL Helper
    copyUrlBtn.addEventListener('click', () => {
      const fullUrl = `${window.location.origin}${window.location.pathname}?theme=${config.theme}&speed=${config.speed}&blur=${config.blur}&particles=${config.particleIntensity}`;
      const textToCopy = window.location.protocol === 'file:' ? window.location.href : fullUrl;

      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast("✨ OBS Browser Source link copied!");
      }).catch(() => {
        // Fallback
        prompt("Copy this URL for OBS Browser Source:", textToCopy);
      });
    });

    function showToast(msg) {
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // --- Init ---
    window.addEventListener('resize', resize);
    window.addEventListener('DOMContentLoaded', () => {
      syncUI();
      resize();
      requestAnimationFrame(renderLoop);
    });
  </script>
</body>
</html>
